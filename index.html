<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convection Current Cruise</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div id="inline-stream-layer" class="fullscreen-user-layer" style="display: none;">
        <div class="user-control-header">
            <button class="close-stream-btn" onclick="closeStreamPortal()">← Back</button>
            <span id="active-stream-title"></span>
            <div style="margin-left: auto; display: flex; gap: 8px;">
                <button class="close-stream-btn" onclick="reloadStreamPortal()">↻ Reload</button>
                <button class="close-stream-btn" onclick="toggleuserFullscreen()">⛶ Fullscreen</button>
            </div>
        </div>
        <div class="stream-frame-container">
            <iframe id="Convection Current Cruise-secure-iframe" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals" allowfullscreen></iframe>
        </div>
    </div>

    <div class="app-shell">
        <aside class="left-sidebar">
            <div class="brand" onclick="switchTab('home-section', document.getElementById('nav-home'))">
                <span class="brand-icon"> </span> Convection Current Cruise
            </div>

            <nav class="side-nav">
                <button id="nav-home" class="nav-tab-btn active" onclick="switchTab('home-section', this)">Home</button>
                <button id="nav-midoceanridge" class="nav-tab-btn" onclick="switchTab('midoceanridge-section', this)">Mid-Ocean Ridge</button>
                <button id="nav-trench" class="nav-tab-btn" onclick="switchTab('trench-section', this)">Trench</button>
                <button id="nav-volcano" class="nav-tab-btn" onclick="switchTab('volcano-section', this)">Volcano</button>
                <button id="nav-mountain" class="nav-tab-btn" onclick="switchTab('mountain-section', this)">Mountain</button>
            </nav>

            <div class="sidebar-promo-card">
                <div class="promo-title">Change Later</div>
<script src="./js/script.js"></script>
</body>
